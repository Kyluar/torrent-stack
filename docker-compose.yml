services:
  jackett:
    image: lscr.io/linuxserver/jackett:0.24.3030
    container_name: jackett
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - AUTO_UPDATE=${AUTO_UPDATE} #optional
      - RUN_OPTS=${RUN_OPTS} #optional
    volumes:
      - ${CONFIG_PATH}:/config
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - 9117:9117
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9117/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # DO NOT expose FlareSolverr to the internet, as it can be abused.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FILE=${LOG_FILE}
      - LOG_HTML=${LOG_HTML}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}:/config
    tmpfs:
      - /tmp:size=256M,mode=1777
    restart: unless-stopped

  qbittorrent:
      image: lscr.io/linuxserver/qbittorrent:5.3.0
      container_name: qbittorrent
      environment:
        - PUID=${PUID}
        - PGID=${PGID}
        - TZ=${TZ}
        - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
        - TORRENTING_PORT=${QBITTORRENT_TORRENTING_PORT}
      volumes:
        - ${CONFIG_PATH}:/config
        - ${DOWNLOADS_PATH}:/downloads #optional
      ports:
        - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
        - "${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}"
        - "${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}/udp"
      stop_grace_period: "10s" #optional
      restart: unless-stopped
      depends_on:
        jackett:
          condition: service_healthy